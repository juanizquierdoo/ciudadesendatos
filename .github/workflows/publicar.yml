# Publica la carpeta web/ en GitHub Pages cada vez que se sube un cambio a main.
# La web se genera en el ordenador (python actualizar.py) y se sube ya hecha:
# aquí no se ejecuta el pipeline porque los datos originales no están en el repositorio.
#
# Dos trabajos separados (como la plantilla oficial de GitHub): el primero sube
# la web como artefacto "github-pages" y el segundo la publica. Así el artefacto
# ya está cerrado y visible cuando deploy-pages lo busca.
# upload-pages-artifact y deploy-pages deben ir en versiones compatibles (v5 + v5).
name: Publicar web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
